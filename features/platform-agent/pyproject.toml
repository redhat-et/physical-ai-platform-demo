[project]
name = "platform-agent"
version = "0.1.0"
description = "Physical AI Platform Agent — LangChain agent with cluster operations tools"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "langchain>=0.3",
    "langchain-openai>=0.3",
    # kfp==2.17.0 hard-pins kubernetes<31 -- confirmed none of our own K8s
    # client usage (CoreV1Api/BatchV1Api/CustomObjectsApi/AppsV1Api) needs
    # anything specific to 31+, so relaxed to what's actually installable
    # alongside kfp rather than fighting its pin.
    "kubernetes>=30.1,<31.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "huggingface_hub>=0.27",
    "kfp>=2.17,<3.0",
    "kfp-kubernetes>=2.17,<3.0",
    "httpx>=0.28",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Explicit rather than relying on hatchling's default package auto-detection:
# skills/<name>/SKILL.md files are fetched into src/platform_agent/skills/ at
# build time by the Containerfile's skills stage rather than committed, and
# the Containerfile's build context has no .git dir, so hatchling's default
# VCS-aware file selection doesn't apply here.
[tool.hatch.build.targets.wheel]
packages = ["src/platform_agent"]
