[project]
name = "platform-agent"
version = "0.1.0"
description = "Physical AI Platform Agent — LangChain agent with cluster operations tools"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    # >=1.0 for langchain.agents.create_agent -- doesn't exist on the 0.3.x line.
    "langchain>=1.0",
    "langchain-openai>=0.3",
    "langchain-mcp-adapters>=0.1",
    # mcp 2.0.0 (released 2026-07-28) moved/removed mcp.shared.context.RequestContext,
    # breaking langchain-mcp-adapters' import of it. Pin to the compatible 1.x line
    # until langchain-mcp-adapters confirms mcp 2.0 support.
    "mcp<2.0",
    # Only for model_readiness.py's direct CoreV1Api/CustomObjectsApi reads
    # (InferenceService/pod status, KEDA ScaledObject patch) -- everything
    # else that used to need cluster access here now goes through
    # pai-mcp-server instead.
    "kubernetes>=30.1,<31.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.28",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Explicit rather than relying on hatchling's default package auto-detection:
# the Containerfile's build context has no .git dir, so hatchling's default
# VCS-aware file selection doesn't apply here.
[tool.hatch.build.targets.wheel]
packages = ["src/platform_agent"]
