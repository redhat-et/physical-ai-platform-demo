apiVersion: v1
kind: ConfigMap
metadata:
  name: robotics-playground-config
  namespace: physical-ai
data:
  config.yaml: |
    server:
      host: "0.0.0.0"
      port: 8000
      log_level: "info"

    rerun:
      grpc_port: 9876
      web_port: 9090
      recording_dir: "/data/rerun"

    bridge:
      type: "ros2"

    ros2:
      domain_id: 0
      cameras:
        wrist: "/vla/obs/wrist_cam"
        table: "/vla/obs/table_cam"
      joint_state_topic: "/vla/obs/state"
      joint_command_topic: "/vla/action"
      state_msg_type: "Float32MultiArray"

    policy:
      type: "openpi"
      default_model: "dreamzero-v1"
      models:
        dreamzero-v1:
          name: "DreamZero"
          # yamllint disable-next-line rule:line-length
          endpoint: "ws://dreamzero-predictor.physical-ai-models.svc.cluster.local/v1/realtime/robot/openpi"
          action_horizon: 4
        pi05-v1:
          name: "pi0.5"
          # yamllint disable-next-line rule:line-length
          endpoint: "ws://pi05-predictor.physical-ai-models.svc.cluster.local/"
          action_horizon: 8
          action_type: "cartesian_delta"
          camera_mapping:
            wrist: "observation/wrist_image_left"
            table: "observation/exterior_image_1_left"
      embodiment:
        joint_names:
          - panda_joint1
          - panda_joint2
          - panda_joint3
          - panda_joint4
          - panda_joint5
          - panda_joint6
          - panda_joint7
        training_order:
          - panda_joint1
          - panda_joint2
          - panda_joint3
          - panda_joint4
          - panda_joint5
          - panda_joint6
          - panda_joint7
        joint_limits:
          panda_joint1: [-2.8973, 2.8973]
          panda_joint2: [-1.7628, 1.7628]
          panda_joint3: [-2.8973, 2.8973]
          panda_joint4: [-3.0718, -0.0698]
          panda_joint5: [-2.8973, 2.8973]
          panda_joint6: [-0.0175, 3.7525]
          panda_joint7: [-2.8973, 2.8973]
        gripper_joint: "panda_finger_joint1"
        gripper_limits: [0.0, 0.04]
        camera_mapping:
          wrist: "observation/wrist_image_left"
          table: "observation/exterior_image_1_left"
