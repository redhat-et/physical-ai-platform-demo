apiVersion: apps/v1
kind: Deployment
metadata:
  name: robotics-playground
  namespace: physical-ai
  labels:
    app: robotics-playground
spec:
  replicas: 1
  selector:
    matchLabels:
      app: robotics-playground
  template:
    metadata:
      labels:
        app: robotics-playground
    spec:
      containers:
        - name: api
          image: quay.io/redhat-et/robotics-playground:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: PLAYGROUND_CONFIG
              value: /etc/robotics-playground/config.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/robotics-playground
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: robotics-playground-config
