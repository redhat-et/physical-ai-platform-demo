apiVersion: apps/v1
kind: Deployment
metadata:
  name: robotics-playground
  namespace: physical-ai
  labels:
    app: robotics-playground
spec:
  replicas: 1
  selector:
    matchLabels:
      app: robotics-playground
  template:
    metadata:
      labels:
        app: robotics-playground
    spec:
      containers:
        - name: api
          image: quay.io/redhat-et/robotics-playground:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: rerun-web
              containerPort: 9090
              protocol: TCP
            - name: rerun-grpc
              containerPort: 9876
              protocol: TCP
          env:
            - name: PLAYGROUND_CONFIG
              value: /etc/robotics-playground/config.yaml
            - name: WS_EXTERNAL_URL
              value: "wss://robotics-playground-api-physical-ai.apps.emerg.pcbk.p1.openshiftapps.com"
            - name: RERUN_VIEWER_URL
              value: "https://robotics-playground-rerun-web-physical-ai.apps.emerg.pcbk.p1.openshiftapps.com"
            - name: RERUN_GRPC_URL
              value: "https://robotics-playground-rerun-grpc-physical-ai.apps.emerg.pcbk.p1.openshiftapps.com"
          volumeMounts:
            - name: config
              mountPath: /etc/robotics-playground
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
        - name: zenoh-bridge
          image: eclipse/zenoh-bridge-ros2dds:1.9.0
          args: ["-c", "/etc/zenoh/config.json5"]
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: zenoh-config
              mountPath: /etc/zenoh
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: robotics-playground-config
        - name: zenoh-config
          configMap:
            name: zenoh-backend-config
