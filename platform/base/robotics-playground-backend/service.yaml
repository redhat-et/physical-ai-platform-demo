apiVersion: v1
kind: Service
metadata:
  name: robotics-playground
  namespace: physical-ai
  labels:
    app: robotics-playground
spec:
  selector:
    app: robotics-playground
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
    - name: rerun-grpc
      port: 9876
      targetPort: rerun-grpc
      protocol: TCP
