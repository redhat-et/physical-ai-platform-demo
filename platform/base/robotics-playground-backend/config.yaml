apiVersion: v1
kind: ConfigMap
metadata:
  name: robotics-playground-config
  namespace: physical-ai
  labels:
    app: robotics-playground
data:
  config.yaml: |
    server:
      host: "0.0.0.0"
      port: 8000
      log_level: "info"

    rerun:
      grpc_port: 9876
      web_port: 9090

    bridge:
      type: "mock"
