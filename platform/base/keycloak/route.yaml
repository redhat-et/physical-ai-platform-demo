apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: keycloak
  namespace: physical-ai
spec:
  host: keycloak-physical-ai.apps.emerg.pcbk.p1.openshiftapps.com
  to:
    kind: Service
    name: keycloak-service
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
