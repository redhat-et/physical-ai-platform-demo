apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: physical-ai
  namespace: physical-ai
spec:
  keycloakCRName: keycloak
  placeholders:
    OPENSHIFT_CLIENT_SECRET:
      secret:
        name: keycloak-broker-secret
        key: client-secret
    PLACEHOLDER_MCP_CLIENT_SECRET:
      secret:
        name: mcp-client-secret
        key: client-secret
  realm:
    realm: physical-ai
    enabled: true
    displayName: Physical AI Platform

    sslRequired: external
    registrationAllowed: false
    loginWithEmailAllowed: true

    # --- Token settings ---
    accessTokenLifespan: 300
    ssoSessionIdleTimeout: 1800
    ssoSessionMaxLifespan: 36000

    # --- Client scopes ---
    clientScopes:
      - name: mcp
        protocol: openid-connect
        description: MCP server access
        attributes:
          include.in.token.scope: "true"
          display.on.consent.screen: "true"

    # --- Default client scopes ---
    defaultDefaultClientScopes:
      - web-origins
      - acr
      - profile
      - email
      - mcp

    # --- Clients ---
    clients:
      # Pre-registered public client for Claude Code and other CLI tools
      - clientId: claude-code
        enabled: true
        publicClient: true
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        attributes:
          pkce.code.challenge.method: S256
        redirectUris:
          - http://localhost/*
          - http://127.0.0.1/*
          - http://[::1]/*
        webOrigins:
          - http://localhost
          - http://127.0.0.1
        defaultClientScopes:
          - web-origins
          - profile
          - email
          - mcp

      # Pre-registered confidential client for non-PKCE harnesses
      - clientId: mcp-client
        enabled: true
        publicClient: false
        standardFlowEnabled: true
        serviceAccountsEnabled: true
        directAccessGrantsEnabled: false
        secret: "${PLACEHOLDER_MCP_CLIENT_SECRET}"
        attributes:
          pkce.code.challenge.method: S256
        redirectUris:
          - http://localhost/*
          - http://127.0.0.1/*
        defaultClientScopes:
          - web-origins
          - profile
          - email
          - mcp

    # --- Identity Providers ---
    identityProviders:
      - alias: openshift
        providerId: oidc
        enabled: true
        trustEmail: true
        firstBrokerLoginFlowAlias: first broker login
        config:
          clientId: keycloak-broker
          clientSecret: "${OPENSHIFT_CLIENT_SECRET}"
          tokenUrl: https://oauth-openshift.apps.emerg.pcbk.p1.openshiftapps.com/oauth/token
          authorizationUrl: https://oauth-openshift.apps.emerg.pcbk.p1.openshiftapps.com/oauth/authorize
          userInfoUrl: https://oauth-openshift.apps.emerg.pcbk.p1.openshiftapps.com/apis/user.openshift.io/v1/users/~
          defaultScope: user:info
          syncMode: IMPORT

    # --- Realm roles ---
    roles:
      realm:
        - name: mcp-user
          description: Can access MCP servers
        - name: mcp-admin
          description: Can manage MCP server configuration
