apiVersion: apps/v1
kind: Deployment
metadata:
  name: isaac-lab
spec:
  strategy:
    type: Recreate
  template:
    spec:
      serviceAccountName: isaac-lab
      securityContext:
        runAsUser: 1234
      nodeSelector:
        gpu-pool-size: xlarge
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: isaac-lab
        - name: zenoh-bridge
