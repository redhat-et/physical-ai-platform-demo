apiVersion: apps/v1
kind: Deployment
metadata:
  name: pai-mcp-server
  namespace: physical-ai
  labels:
    app: pai-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pai-mcp-server
  template:
    metadata:
      labels:
        app: pai-mcp-server
    spec:
      serviceAccountName: pai-mcp-server
      volumes:
        - name: skills-repo
          emptyDir: {}
      initContainers:
        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.2.4
          restartPolicy: Always
          args:
            - --repo=https://github.com/redhat-et/physical-ai-platform-agent-skills.git
            - --ref=main
            - --root=/skills-repo
            - --link=current
            - --period=60s
          volumeMounts:
            - name: skills-repo
              mountPath: /skills-repo
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
      containers:
        - name: server
          image: quay.io/redhat-et/pai-mcp-server:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          env:
            - name: PAI_MCP_SKILLS_ROOT
              value: /skills-repo/current/skills
            - name: DATASETS_NAMESPACE
              value: physical-ai
            - name: MODELS_NAMESPACE
              value: physical-ai-models
            - name: PAI_MCP_OPENSHIFT_MCP_URL
              value: http://openshift-mcp-server.physical-ai.svc:8080/mcp
            - name: HOME
              value: /tmp
            - name: HF_HOME
              value: /tmp/hf_home
          volumeMounts:
            - name: skills-repo
              mountPath: /skills-repo
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
