apiVersion: apps/v1
kind: Deployment
metadata:
  name: pai-mcp-server
  namespace: physical-ai
  labels:
    app: pai-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pai-mcp-server
  template:
    metadata:
      labels:
        app: pai-mcp-server
    spec:
      serviceAccountName: pai-mcp-server
      volumes:
        - name: skills-repo
          emptyDir: {}
      initContainers:
        # Native sidecar (restartPolicy: Always, K8s 1.28+) -- keeps
        # /skills-repo/current current on an interval. Skill content updates
        # take effect here with no rebuild or redeploy of this Deployment;
        # only this container's own image/args change requires one.
        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.2.4
          restartPolicy: Always
          args:
            - --repo=https://github.com/redhat-et/physical-ai-platform-agent-skills.git
            - --ref=main
            - --root=/skills-repo
            - --link=current
            - --period=60s
          volumeMounts:
            - name: skills-repo
              mountPath: /skills-repo
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
        # Relocated from platform-agent's pod -- generic k8s_* passthrough
        # tools are proxied through this server's single connection instead
        # of agents dialing openshift-mcp-server directly (see proxy.py).
        - name: mcp-server
          image: quay.io/redhat-et/openshift-mcp-server:latest
          imagePullPolicy: Always
          restartPolicy: Always
          args: ["--port", "8080", "--toolsets=core"]
          ports:
            - name: mcp
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: mcp
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
      containers:
        - name: server
          image: quay.io/redhat-et/pai-mcp-server:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          env:
            - name: PAI_MCP_SKILLS_ROOT
              value: /skills-repo/current/skills
          volumeMounts:
            - name: skills-repo
              mountPath: /skills-repo
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
