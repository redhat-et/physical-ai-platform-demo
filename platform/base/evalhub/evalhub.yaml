# EvalHub — evaluation orchestration service, reconciled by the TrustyAI
# service operator (DSC trustyai component). Backs the "Evaluations" page
# under Develop & Train in the RHOAI console (gated by disableLMEval: false
# in the OdhDashboardConfig patch).
#
# The evalhub-db-url Secret (db-url key) is generated by
# platform/preflight.sh --generate-secrets and is not stored in Git.
apiVersion: trustyai.opendatahub.io/v1
kind: EvalHub
metadata:
  name: evalhub
  namespace: physical-ai
spec:
  replicas: 1
  database:
    type: postgresql
    secret: evalhub-db-url
  providers:
    - lm-evaluation-harness
    - garak
    - guidellm
  env:
    - name: MLFLOW_TRACKING_URI
      value: https://mlflow.redhat-ods-applications.svc:8443/mlflow
