apiVersion: opendatahub.io/v1alpha
kind: OdhDashboardConfig
metadata:
  name: odh-dashboard-config
  namespace: redhat-ods-applications
spec:
  dashboardConfig:
    agentConfigManagement: true
    agentOps: true
    agentsCatalog: true
    connectionTest: true
    # Enables the "Evaluations" page (EvalHub) under Develop & Train.
    # Requires the trustyai DSC component (Managed) and the EvalHub CR in
    # platform/base/evalhub/. Inverted flag: false = enabled.
    disableLMEval: false
    disableKServeMetrics: false
    disablePerformanceMetrics: false
    genAiStudio: true
    guardrails: true
    mcpCatalog: true
    mcpRegistry: true
    modelAsService: true
    observabilityDashboard: true
