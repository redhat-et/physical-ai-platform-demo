            url,
            data=data,
            files=files,
            headers={"Accept": "video/mp4"},
        )
        response.raise_for_status()

    # 3. Save the generated video
    output_path = Path("/tmp/cosmos3_nano_i2vs.mp4")
    output_path.write_bytes(response.content)
    print(f"Saved video to {output_path}")
