# Project permissions for the physical-ai model registry.
#
# The RHOAI dashboard shows a "No project permissions" warning until at least
# one RoleBinding exists that is labeled app.kubernetes.io/name=<registry> and
# opendatahub.io/rb-project-subject="true" with a Group subject of the form
# system:serviceaccounts:<project> (see odh-dashboard ModelRegistriesTableRow
# and ProjectsSettingsTab). These bindings grant service accounts in the
# platform projects access to the registry via the operator-managed
# registry-user-physical-ai Role, enabling workbench access and project-scoped
# model storage transfer jobs.
#
# Git is the source of truth for these grants. To grant an additional
# project, add a RoleBinding below. To revoke a project's access, remove its
# RoleBinding from this file AND delete the live object: an ArgoCD sync with
# pruning removes it automatically, but a plain `oc apply -k` (as documented
# in README.md) does not delete bindings that are no longer in the file —
# run `oc delete rolebinding <name> -n rhoai-model-registries` in that case.
#
# The bindings here have fixed names and are reconciled by ArgoCD
# (prune/selfHeal): removing them via the dashboard does not revoke access,
# as the next sync re-creates them. Manage these grants exclusively through
# this file; the dashboard's Projects tab only suits ad-hoc grants it created
# itself (dashboard-permissions-* objects).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: physical-ai-project-physical-ai
  namespace: rhoai-model-registries
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/rb-project-subject: "true"
    app: physical-ai
    app.kubernetes.io/component: model-registry
    app.kubernetes.io/part-of: model-registry
    app.kubernetes.io/name: physical-ai
    component: model-registry
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: registry-user-physical-ai
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:serviceaccounts:physical-ai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: physical-ai-project-physical-ai-models
  namespace: rhoai-model-registries
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/rb-project-subject: "true"
    app: physical-ai
    app.kubernetes.io/component: model-registry
    app.kubernetes.io/part-of: model-registry
    app.kubernetes.io/name: physical-ai
    component: model-registry
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: registry-user-physical-ai
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:serviceaccounts:physical-ai-models
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: physical-ai-project-physical-ai-datasets
  namespace: rhoai-model-registries
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/rb-project-subject: "true"
    app: physical-ai
    app.kubernetes.io/component: model-registry
    app.kubernetes.io/part-of: model-registry
    app.kubernetes.io/name: physical-ai
    component: model-registry
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: registry-user-physical-ai
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:serviceaccounts:physical-ai-datasets
