# Based on vLLM-Omni v0.34.0's vllm_omni/deploy/pi05.yaml.
pipeline: pi05
async_chunk: false
distributed_executor_backend: mp
dtype: float32
stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 1
    enforce_eager: true
    model_class_name: Pi05Pipeline
    model_config:
      # Inputs are 256x256; PaliGemma preprocessing resizes to 224x224.
      image_resolution: [224, 224]
      # Two real cameras plus the checkpoint's masked third slot.
      max_cameras: 3
      image_feature_keys:
        - observation.images.image
        - observation.images.image2
      # The checkpoint declares an 8-value state and 7-value action. Keep the
      # 32-wide internal action projection from the checkpoint weights.
      policy_server_config:
        image_resolution: [224, 224]
        n_external_cameras: 1
        needs_wrist_camera: true
        needs_stereo_camera: false
        needs_session_id: false
        action_horizon: 10
        action_dim: 7
        max_action_dim: 32
        max_cameras: 3
