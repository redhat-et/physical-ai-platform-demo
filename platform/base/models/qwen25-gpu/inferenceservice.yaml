apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen25-gpu
  namespace: physical-ai-models
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/genai-asset: "true"
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
    serving.kserve.io/autoscalerClass: external
    sidecar.istio.io/inject: "false"
    physical-ai.io/output-kind: chat
spec:
  predictor:
    minReplicas: 0
    deploymentStrategy:
      type: Recreate
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-L40S
    volumes:
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
    model:
      modelFormat:
        name: vllm
      runtime: vllm-qwen25-gpu-runtime
      storageUri: pvc://qwen25-gpu-model-cache
      volumeMounts:
      - name: dshm
        mountPath: /dev/shm
      resources:
        requests:
          cpu: "4"
          memory: 32Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "8"
          memory: 48Gi
          nvidia.com/gpu: "1"
