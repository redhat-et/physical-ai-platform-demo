apiVersion: batch/v1
kind: Job
metadata:
  name: download-qwen25-gpu-model
  namespace: physical-ai-models
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: downloader
        image: python:3.11-slim
        command:
        - /bin/bash
        - -c
        - |
          set -e
          pip install -q huggingface_hub
          python3 << 'PYEOF'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id='Qwen/Qwen2.5-14B-Instruct',
              local_dir='/mnt/models',
          )
          print("Download complete!")
          import os
          print(f"Files: {len(os.listdir('/mnt/models'))}")
          PYEOF
        volumeMounts:
        - name: model-storage
          mountPath: /mnt/models
        resources:
          requests:
            cpu: "1"
            memory: 4Gi
          limits:
            cpu: "2"
            memory: 16Gi
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: qwen25-gpu-model-cache
