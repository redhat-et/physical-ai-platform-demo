apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: qwen3-omni-vllm-omni-compat
  namespace: physical-ai-models
  labels:
    monitoring.opendatahub.io/scrape: "true"
spec:
  groups:
  - name: qwen3-omni-vllm-omni-compat
    interval: 30s
    rules:
    - record: vllm:request_success_total
      expr: >-
        label_replace(
          label_replace(
            http_requests_total{namespace="physical-ai-models", job="qwen3-omni-metrics", status="2xx"},
            "model_name", "qwen3-omni", "model_name", ".*"),
          "finished_reason", "stop", "", "")
    - record: vllm:request_success_total
      expr: >-
        label_replace(
          label_replace(
            http_requests_total{namespace="physical-ai-models", job="qwen3-omni-metrics", status="5xx"},
            "model_name", "qwen3-omni", "model_name", ".*"),
          "finished_reason", "error", "", "")
    - record: vllm:e2e_request_latency_seconds_count
      expr: >-
        label_replace(
          http_request_duration_highr_seconds_count{namespace="physical-ai-models", job="qwen3-omni-metrics"},
          "model_name", "qwen3-omni", "model_name", ".*")
    - record: vllm:e2e_request_latency_seconds_sum
      expr: >-
        label_replace(
          http_request_duration_highr_seconds_sum{namespace="physical-ai-models", job="qwen3-omni-metrics"},
          "model_name", "qwen3-omni", "model_name", ".*")
    - record: vllm:e2e_request_latency_seconds_bucket
      expr: >-
        label_replace(
          http_request_duration_highr_seconds_bucket{namespace="physical-ai-models", job="qwen3-omni-metrics"},
          "model_name", "qwen3-omni", "model_name", ".*")
    - record: vllm:num_requests_running
      expr: >-
        label_replace(
          vllm:omni_num_requests_running{namespace="physical-ai-models", job="qwen3-omni-metrics"},
          "model_name", "qwen3-omni", "model_name", ".*")
    - record: vllm:num_requests_waiting
      expr: >-
        label_replace(
          vllm:omni_num_requests_waiting{namespace="physical-ai-models", job="qwen3-omni-metrics"},
          "model_name", "qwen3-omni", "model_name", ".*")
