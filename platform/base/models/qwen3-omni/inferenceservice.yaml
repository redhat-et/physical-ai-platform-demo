apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen3-omni
  namespace: physical-ai-models
  labels:
    opendatahub.io/dashboard: "true"
    opendatahub.io/genai-asset: "true"
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
    serving.kserve.io/autoscalerClass: external
    sidecar.istio.io/inject: "false"
    physical-ai.io/output-kind: chat
spec:
  predictor:
    minReplicas: 0
    deploymentStrategy:
      type: Recreate
    nodeSelector:
      nvidia.com/gpu.product: NVIDIA-L40S
    volumes:
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
    - name: deploy-config
      configMap:
        name: qwen3-omni-deploy-config
    model:
      modelFormat:
        name: pytorch
      runtime: vllm-omni-runtime
      storageUri: pvc://qwen3-omni-model-cache
      args:
      - --trust-remote-code
      - --deploy-config=/etc/vllm-omni/deploy-config.yaml
      - --stage-init-timeout=900
      - --enable-auto-tool-choice
      - --tool-call-parser=hermes
      volumeMounts:
      - name: dshm
        mountPath: /dev/shm
      - name: deploy-config
        mountPath: /etc/vllm-omni
        readOnly: true
      resources:
        requests:
          cpu: "4"
          memory: 64Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "8"
          memory: 128Gi
          nvidia.com/gpu: "1"
