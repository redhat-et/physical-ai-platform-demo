apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openshift-mcp-server
  namespace: physical-ai
spec:
  parentRefs:
    - name: mcp-gateway
      namespace: physical-ai
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /openshift/mcp
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /mcp
      backendRefs:
        - name: openshift-mcp-server
          port: 8080
---
