apiVersion: v1
kind: ConfigMap
metadata:
  name: maas-proxy-allowlist
  namespace: physical-ai-models
data:
  model-allowlist.conf: |
    # Allowlist of valid model names
    # Always-on models route directly to predictor
    # Scale-to-zero models route through KEDA interceptor

    map $model $backend_addr {
      mocklm-describe  mocklm-describe-predictor.physical-ai-models.svc.cluster.local:80;
      mocklm-detect    mocklm-detect-predictor.physical-ai-models.svc.cluster.local:80;
      mocklm-echo      mocklm-echo-predictor.physical-ai-models.svc.cluster.local:80;
      mocklm-eliza     mocklm-eliza-predictor.physical-ai-models.svc.cluster.local:80;
      cosmos3-nano     keda-add-ons-http-interceptor-proxy.openshift-keda.svc.cluster.local:8080;
      dreamzero        keda-add-ons-http-interceptor-proxy.openshift-keda.svc.cluster.local:8080;
      qwen3-omni       keda-add-ons-http-interceptor-proxy.openshift-keda.svc.cluster.local:8080;
      qwen25-cpu       keda-add-ons-http-interceptor-proxy.openshift-keda.svc.cluster.local:8080;
      default          "";
    }

    map $model $backend_host {
      cosmos3-nano     cosmos3-nano-predictor.physical-ai-models.svc.cluster.local;
      dreamzero        dreamzero-predictor.physical-ai-models.svc.cluster.local;
      qwen3-omni       qwen3-omni-predictor.physical-ai-models.svc.cluster.local;
      qwen25-cpu       qwen25-cpu-predictor.physical-ai-models.svc.cluster.local;
      default          $http_host;
    }
