apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-agent
  namespace: physical-ai
  labels:
    app: platform-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-agent
  template:
    metadata:
      labels:
        app: platform-agent
    spec:
      serviceAccountName: platform-agent
      # openshift-mcp-server relocated to pai-mcp-server's pod -- this
      # pod now only reaches it (and pai-mcp-server's own native tools)
      # over the network via pai-mcp-server's Service, never colocated.
      containers:
        - name: agent
          image: quay.io/redhat-et/physical-ai-agent:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: platform-agent-config
          env:
            - name: AGENT_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-agent-llm
                  key: api-key
                  optional: true
            - name: HF_HOME
              value: /tmp/hf_home
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 1Gi
