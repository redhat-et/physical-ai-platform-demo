---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-agent
  namespace: physical-ai-models
rules:
  - apiGroups: ["serving.kserve.io"]
    resources: ["inferenceservices"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-agent
  namespace: physical-ai-models
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: platform-agent
subjects:
  - kind: ServiceAccount
    name: platform-agent
    namespace: physical-ai
---
# MLflow's kubernetes-auth app authorizes requests via a SelfSubjectAccessReview
# against this synthetic resource. platform-agent no longer needs it directly
# (see pai-mcp-server-mlflow-experiments-access) -- this Role definition
# stays here since pipeline-runner-dspa's binding still references it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlflow-experiments-access
  namespace: physical-ai
rules:
  - apiGroups: ["mlflow.kubeflow.org"]
    resources: ["experiments"]
    verbs: ["get", "list", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlflow-experiments-access
  namespace: physical-ai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mlflow-experiments-access
subjects:
  - kind: ServiceAccount
    name: pipeline-runner-dspa
    namespace: physical-ai
