apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: platform-agent-api
  namespace: physical-ai
  annotations:
    haproxy.router.openshift.io/timeout: 300s
spec:
  to:
    kind: Service
    name: platform-agent
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
