apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: physical-ai-platform-dev
  namespace: openshift-gitops
  labels:
    environment: dev
    profile: standard
spec:
  project: default

  source:
    repoURL: https://github.com/redhat-et/physical-ai-platform-demo.git
    targetRevision: main
    path: platform/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: physical-ai

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
      # The DSC patch is what enables MaaS, which is what registers the
      # maas.opendatahub.io CRDs -- and the overlay's MaaS CRs are in the same
      # sync. Without this, ArgoCD dry-runs every resource before applying any,
      # fails with "failed to discover server resources for group version
      # maas.opendatahub.io/v1alpha1", and never applies the DSC that would have
      # created them. A first install can then never converge.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    - group: datasciencecluster.opendatahub.io
      kind: DataScienceCluster
      jsonPointers:
        - /status
    - group: serving.kserve.io
      kind: InferenceService
      jsonPointers:
        - /status
        - /metadata/annotations/serving.kserve.io~1deploymentMode
        - /metadata/annotations/modelFormat
        - /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
    - group: apps
      kind: StatefulSet
      name: maas-db
      jsonPointers:
        - /spec/replicas
    - group: batch
      kind: Job
      jsonPointers:
        - /spec/template
