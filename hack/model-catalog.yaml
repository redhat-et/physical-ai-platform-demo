# Entries follow the Hub's main branch unless revision is specified.
# Keep name stable: it is part of the RHOAI model card URL.
models:
- name: Cosmos3-Nano
  repo: nvidia/Cosmos3-Nano
  overrides:
    provider: NVIDIA
    description: World foundation model for physical AI, including video generation and world simulation.
    tasks: [video-generation]
  supplement: |-
    [Physical AI demo deployment guide](https://github.com/redhat-et/physical-ai-platform-demo/blob/main/platform/base/models/cosmos3-nano/README.md)
- name: DreamZero-DROID
  repo: GEAR-Dreams/DreamZero-DROID
  overrides:
    provider: GEAR-Dreams
    description: Robotic action prediction policy trained on the DROID dataset for manipulation tasks.
  supplement: |-
    [Physical AI demo deployment guide](https://github.com/redhat-et/physical-ai-platform-demo/blob/main/platform/base/models/dreamzero/README.md)
- name: π0.5
  repo: lerobot/pi05_base
  overrides:
    provider: Physical Intelligence
    description: Vision-language-action policy that predicts robotic action trajectories from observations.
    licenseLink: https://ai.google.dev/gemma/terms
  supplement: |-
    The `pi05_droid` policy requires matching DROID normalization statistics.

    [Physical AI demo serving guide](https://github.com/redhat-et/physical-ai-platform-demo/blob/main/platform/base/models/pi05/README.md)
